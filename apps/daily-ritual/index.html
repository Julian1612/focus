<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusOS - Daily Ritual</title>
    <style>
        :root {
            --bg-color: #1c1c1e;
            --card-color: #2c2c2e;
            --text-primary: #f2f2f7;
            --text-secondary: #8d8d92;
            --accent-color: #af52de;
            --border-color: #3a3a3c;
            --success-color: #32d74b;
        }
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }
        
        .daily-ritual-app {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: stretch; 
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 25%, hsla(264, 40%, 20%, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, hsla(280, 40%, 25%, 0.4) 0%, transparent 30%);
        }

        .routine-board {
            display: flex;
            gap: 2rem;
            width: 100%;
        }

        .routine-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.5rem;
            border-radius: 16px;
            
            background: rgba(44, 44, 46, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
            min-height: 0;
        }

        .routine-card.is-active {
            box-shadow: 0 0 25px rgba(175, 82, 222, 0.3);
            border-color: rgba(175, 82, 222, 0.5);
        }

        .card-header {
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .card-header h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            border-radius: 2px;
            transition: width 0.5s ease-out;
        }

        .task-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .task-list::-webkit-scrollbar { width: 6px; }
        .task-list::-webkit-scrollbar-track { background: transparent; }
        .task-list::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 3px; }
        .task-list::-webkit-scrollbar-thumb:hover { background-color: var(--text-secondary); }

        .task-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.4s ease, order 0.4s ease;
            order: 0;
            flex-shrink: 0;
        }
        
        .task-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .task-item.is-completed {
            opacity: 0.5;
            order: 1;
        }
        
        .task-item.is-completed .task-label {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            border: 1px solid var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .custom-checkbox svg {
            width: 14px;
            height: 14px;
            stroke: white;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .task-item.is-completed .custom-checkbox {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .task-item.is-completed .custom-checkbox svg {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div class="daily-ritual-app" id="daily-ritual-root">
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
